name: Build Qt6 Cross-Platform

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master, develop ]
  workflow_dispatch:

env:
  # Версия Qt для Linux (динамическая линковка)
  QT_VERSION: 6.7.2
  # Имя вашего .pro-файла без расширения = имя бинарника
  APP_NAME: e8unpack
  PRO_FILE: e8unpack.pro

jobs:
  # ============================================================
  # LINUX (GCC, динамическая линковка Qt)
  # ============================================================
  build-linux:
    name: Linux GCC (dynamic)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_VERSION }}
          arch: linux_gcc_64
          cache: true
          # modules: 'qtimageformats qtmultimedia'   # раскомментируйте нужные

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            libgl1-mesa-dev libglu1-mesa-dev \
            libxkbcommon-x11-0 libxcb-icccm4 libxcb-image0 \
            libxcb-keysyms1 libxcb-randr0 libxcb-render-util0 \
            libxcb-shape0 libxcb-xinerama0 libxcb-xinput0 \
            libxcb-xfixes0 libxcb-cursor0

      - name: Configure (qmake)
        run: |
          mkdir -p build
          cd build
          qmake ../${{ env.PRO_FILE }} CONFIG+=release

      - name: Build
        run: |
          cd build
          make -j$(nproc)

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.APP_NAME }}-linux-x86_64
          path: build/${{ env.APP_NAME }}
          if-no-files-found: error

  # ============================================================
  # WINDOWS (MinGW, статическая сборка — один .exe без DLL)
  # ============================================================
  build-windows:
    name: Windows MinGW (static)
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      # ---------- Установка MSYS2 + MinGW + статический Qt6 ----------
      # Помимо qt6-static явно ставим его статические зависимости,
      # иначе линковка упадёт с "cannot find -lb2 / -lpcre2-16 / ...".
      - name: Setup MSYS2
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: >-
            mingw-w64-x86_64-gcc
            mingw-w64-x86_64-make
            mingw-w64-x86_64-qt6-static
            mingw-w64-x86_64-pcre2
            mingw-w64-x86_64-libb2
            mingw-w64-x86_64-libtiff
            mingw-w64-x86_64-libjpeg-turbo
            mingw-w64-x86_64-libwebp
            mingw-w64-x86_64-libpng
            mingw-w64-x86_64-zlib
            mingw-w64-x86_64-brotli
            mingw-w64-x86_64-freetype
            mingw-w64-x86_64-harfbuzz
            mingw-w64-x86_64-glib2
            mingw-w64-x86_64-graphite2
            mingw-w64-x86_64-lcms2
            mingw-w64-x86_64-libmng
            mingw-w64-x86_64-lerc
            mingw-w64-x86_64-jbigkit
            mingw-w64-x86_64-libdeflate

      - name: Configure (qmake, static)
        shell: msys2 {0}
        run: |
          mkdir -p build
          cd build
          /mingw64/qt6-static/bin/qmake.exe ../${{ env.PRO_FILE }} CONFIG+=release

      - name: Build
        shell: msys2 {0}
        run: |
          cd build
          mingw32-make -j$(nproc)

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.APP_NAME }}-windows-static
          path: build/release/${{ env.APP_NAME }}.exe
          if-no-files-found: error